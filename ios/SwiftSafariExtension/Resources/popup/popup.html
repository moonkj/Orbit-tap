<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 16px; width: 280px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { color: #666; font-size: 13px; margin: 0 0 16px; }
    .status { display: flex; align-items: center; gap: 8px; padding: 8px; background: #f5f5f5; border-radius: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #30d158; }
  </style>
</head>
<body>
  <h1>Swift Gestures</h1>
  <p>The Swift Gestures for Safari</p>
  <div class="status">
    <div class="dot"></div>
    <span>Extension Active</span>
  </div>
</body>
</html>
